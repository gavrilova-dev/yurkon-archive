name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install and bundle Tesseract OCR
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "tesseract-setup.exe"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $source = Join-Path $env:ProgramFiles "Tesseract-OCR"
          if (!(Test-Path (Join-Path $source "tesseract.exe"))) { throw "Tesseract installation was not found." }
          New-Item -ItemType Directory -Force -Path "build/tesseract/tessdata" | Out-Null
          Copy-Item -Path "$source/*" -Destination "build/tesseract" -Recurse -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata" -OutFile "build/tesseract/tessdata/rus.traineddata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata" -OutFile "build/tesseract/tessdata/eng.traineddata"
          & "build/tesseract/tesseract.exe" --list-langs --tessdata-dir "build/tesseract/tessdata"
          if ($LASTEXITCODE -ne 0) { throw "Tesseract language data validation failed." }
      - name: Compile Python files
        run: python -m compileall -q app tests main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean "YURKON Archive.spec"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: YURKON-Archive-Windows
          path: dist/YURKON Archive.exe
          if-no-files-found: error
