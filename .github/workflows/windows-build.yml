name: Windows build and tests

on:
  push:
    branches: [main, remove-ocr]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app tests main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean "YURKON Archive.spec"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: YURKON-Archive-Windows
          path: dist/YURKON Archive.exe
          if-no-files-found: error
